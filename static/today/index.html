<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="/bridging-tab-title.js" defer></script>
        <title>Bridging</title>

        <link rel="icon" href="/favicon.ico?v=8" sizes="32x32" />
        <link rel="icon" type="image/png" href="/favicon.png?v=8" sizes="64x64" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/pwa/apple-touch-icon.png?v=8" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bridging" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="/brand/pages.css" />
    <style>
      .daily-hero { padding-bottom: 56px; }
      .daily-hero .meta { margin: 14px 0 0; }
      .daily-card .result[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="wrap">
        <nav class="nav" aria-label="Primary">
          <a class="nav-brand" href="/" aria-label="Bridging home">
            <img src="/brand/bridging-logo-full.png" alt="bridging" width="184" height="30" />
          </a>
          <div class="nav-links">
            <a href="/higher-education">Higher Education</a>
            <a href="/l1r5-calculator">Calculator</a>
            <a href="/cut-off-points">Cut-off points</a>
            <a href="/today">Daily question</a>
            <a href="/about">About</a>
          </div>
          <a class="nav-cta" href="/signup">Start revising</a>
        </nav>
      </div>
    </div>
    <div class="wrap wrap-narrow">
      <main>
        <section class="hero daily-hero">
          <span class="eyebrow">Daily E-Math</span>
          <h1>Today’s <em>question</em>.</h1>
          <p class="lede">One O-Level E-Math question a day. Answer it, get marked, keep the streak going.</p>
          <p class="meta" id="dateLine"></p>
        </section>

        <section class="panel daily-card">
          <img class="brix" src="/brand/brix.png" alt="" width="104" height="104" />
          <span class="overline">Question</span>
          <p class="prompt" id="prompt">Loading today’s question…</p>
          <form id="form">
            <label class="lbl" for="answer">Your answer</label>
            <textarea id="answer" name="answer" required autocomplete="off" placeholder="Type your answer"></textarea>
            <button type="submit" id="submit">Mark my answer →</button>
          </form>
          <div id="result" class="result" hidden></div>
        </section>
      </main>
      <footer data-bridging-site-footer></footer>
    </div>
    <script src="/brand/site-chrome.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script>
      const KEY = 'bridging-daily-streak';
      const promptEl = document.getElementById('prompt');
      const dateLine = document.getElementById('dateLine');
      const form = document.getElementById('form');
      const answer = document.getElementById('answer');
      const submit = document.getElementById('submit');
      const result = document.getElementById('result');
      let questionId = '';
      let date = '';

      function loadStreak() {
        try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; }
      }
      function saveStreak(data) {
        localStorage.setItem(KEY, JSON.stringify(data));
        const extra = dateLine.dataset.meta || '';
        dateLine.textContent = extra + (extra ? ' · ' : '') + 'streak ' + (data.count || 0);
      }
      function yesterday(iso) {
        const d = new Date(iso + 'T12:00:00+08:00');
        d.setDate(d.getDate() - 1);
        return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Singapore' }).format(d);
      }
      function typeset() {
        if (typeof renderMathInElement !== 'function') return;
        renderMathInElement(promptEl, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }

      fetch('/api/practice/daily')
        .then((r) => r.json())
        .then((data) => {
          questionId = data.questionId;
          date = data.date;
          const bits = [data.date].concat(data.difficulty ? [data.difficulty] : []);
          dateLine.dataset.meta = bits.join(' · ');
          saveStreak(loadStreak());
          promptEl.textContent = data.prompt;
          typeset();
          const s = loadStreak();
          if (s.lastDate === date) {
            result.hidden = false;
            result.className = 'result ' + (s.lastCorrect ? 'ok' : 'no');
            result.textContent = s.lastCorrect ? 'Already marked correct today.' : 'Already attempted today — you can try again, or come back tomorrow.';
            if (s.lastCorrect) form.hidden = true;
          }
        })
        .catch(() => {
          promptEl.innerHTML = '<span class="err">Could not load today’s question.</span>';
        });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submit.disabled = true;
        result.hidden = true;
        try {
          const res = await fetch('/api/practice/mark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ questionId, studentAnswer: answer.value }),
          });
          const data = await res.json();
          const ok = !!data.isCorrect;
          result.hidden = false;
          result.className = 'result ' + (ok ? 'ok' : 'no');
          result.textContent = ok
            ? (data.feedback || 'Correct.')
            : (data.feedback || data.error || 'Not yet. Try again, or come back tomorrow.');
          if (ok) {
            const s = loadStreak();
            const next = { lastDate: date, lastCorrect: true, count: 1 };
            if (s.lastDate === yesterday(date) && s.lastCorrect) next.count = (s.count || 0) + 1;
            else if (s.lastDate === date) next.count = s.count || 1;
            saveStreak(next);
            form.hidden = true;
          }
        } catch {
          result.hidden = false;
          result.className = 'result no';
          result.textContent = 'Could not mark. Check your connection.';
        } finally {
          submit.disabled = false;
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      }
    </script>
  </body>
</html>
